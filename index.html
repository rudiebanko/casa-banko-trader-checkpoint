<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>BANKO TRADER CHECKPOINT</title><style>:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0d0e;color:#f4f3ef}main{max-width:610px;margin:auto;padding:32px 18px 120px}.brand{text-align:center;letter-spacing:4px;font-size:11px;color:#c8aa69;font-weight:800}h1{text-align:center;font-size:clamp(25px,6vw,38px);letter-spacing:-1.2px;margin:12px 0 6px}.subtitle{text-align:center;color:#929292;font-size:11px;letter-spacing:2px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:30px 0 22px}.tab{border:1px solid #363638;background:#171819;color:#a7a7a7;padding:14px 8px;border-radius:8px;font-size:11px;letter-spacing:.6px;font-weight:800;cursor:pointer}.tab.active{background:#eeeae1;color:#111;border-color:#eeeae1}.intro{color:#a6a6a6;font-size:13px;line-height:1.65;margin:0 0 23px}.section{margin:26px 0 12px;color:#c7aa71;font-size:11px;font-weight:800;letter-spacing:2px}.item{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:17px 14px;background:#161718;border:1px solid #303133;border-radius:9px;color:#f2f2f2;margin:8px 0;cursor:pointer}.item[aria-pressed=true]{border-color:#b89d68;background:#201f1a}.square{flex:0 0 22px;height:22px;border:1px solid #757575;border-radius:4px;display:grid;place-items:center;font-size:14px}.item[aria-pressed=true] .square{background:#c8aa69;color:#0c0d0e;border-color:#c8aa69}.copy{display:grid;gap:7px}.check-title{font-size:14px;font-weight:700}.check-desc{color:#a5a5a5;font-size:12px;line-height:1.55}.footer{position:sticky;bottom:12px;margin-top:26px;background:#1b1c1d;border:1px solid #3a3a3a;border-radius:12px;padding:17px;box-shadow:0 8px 40px #000b}.status{font-size:13px;font-weight:900;letter-spacing:1px}.status.ready{color:#c8aa69}.progress{font-size:12px;color:#aaa;margin-top:7px}.bar{height:5px;background:#3a3a3a;border-radius:5px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:#c8aa69;transition:width .2s}button.reset{margin-top:14px;background:transparent;color:#bfbfbf;border:1px solid #555;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:11px}.hidden{display:none}.prompt{border-left:2px solid #c8aa69;padding:12px 15px;background:#201e19;color:#e7d5b3;font-size:12px;line-height:1.5;margin:10px 0}.actions{display:flex;gap:9px;margin-top:12px}.actions button{padding:10px 18px;border:1px solid #87734e;border-radius:5px;background:#222;color:white;font-weight:700;cursor:pointer}.actions button:first-child{background:#c8aa69;color:#111}.note{font-size:11px;color:#777;text-align:center;margin-top:22px}.tabs{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.tab{font-size:9px;padding:13px 3px;letter-spacing:0}.log-actions{display:grid;gap:8px;margin-top:14px}.log-btn{border:1px solid #bba06a;border-radius:7px;background:#c8aa69;color:#101010;padding:12px;font-weight:850;cursor:pointer;text-align:center}.log-btn.secondary{background:#242424;color:#f2f2f2;border-color:#555}.log-btn:disabled{opacity:.35;cursor:not-allowed}.log-note{width:100%;background:#111;border:1px solid #4a4a4a;border-radius:7px;color:#eee;padding:11px;font:inherit;font-size:13px;resize:vertical}.log-label{display:block;color:#aaa;font-size:11px;margin:12px 0 7px}.log-card{background:#191a1b;border:1px solid #353535;border-radius:9px;padding:15px;margin:9px 0}.log-meta{font-size:11px;color:#aaa}.log-title{font-size:14px;font-weight:750;margin:8px 0;color:#eee}.log-small{font-size:12px;color:#aaa;line-height:1.6}.log-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.log-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.log-tools button{background:#232323;border:1px solid #555;color:#eee;border-radius:6px;padding:9px 12px;font-size:11px;cursor:pointer}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat-number{font-size:25px;color:#e9e6dc;font-weight:800;margin:6px 0}.empty{padding:30px 10px;text-align:center;color:#999;font-size:13px}.log-card details{margin-top:9px}.log-card summary{cursor:pointer;color:#c8aa69;font-size:12px}.notice{font-size:11px;color:#999;line-height:1.6;margin-top:14px}
/* Personal BANKO CHECKPOINT visual language, scoped to trader app */
:root{--bg:#050505;--card:#111112;--line:#29292b;--gold:#d7b43d;--white:#f5f5f5;--muted:#96969a;--green:#89bd8d}
html,body{background:var(--bg);color:var(--white)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:570px;padding:46px 20px calc(40px + env(safe-area-inset-bottom))}
.brand{font-size:13px;letter-spacing:.45em;color:var(--gold);font-weight:750}
h1{font-size:clamp(32px,8vw,45px);line-height:1.06;letter-spacing:.045em;margin:11px 0 0;font-weight:820}
.subtitle{margin:17px 0 0;color:#8f8f93;font-size:11px;letter-spacing:.25em;font-weight:650}
.tabs{gap:7px;margin:30px 0 0;padding-bottom:24px;border-bottom:1px solid #1d1d1f}
.tab{min-height:48px;background:transparent;border:1px solid #343436;border-radius:13px;color:#929296;font-size:10px;line-height:1.35;font-weight:780;padding:7px 5px;letter-spacing:.02em}
.tab.active{color:#f7f2e6;background:#17140b;border-color:var(--gold)}
.intro{text-align:center;margin:0;padding:31px 0 20px;font-size:14px;line-height:1.55;color:var(--muted)}
.section{margin:24px 0 13px;font-size:12px;font-weight:800;letter-spacing:.19em;color:var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px 18px;gap:15px;margin:0 0 11px}
.item[aria-pressed=true]{border-color:#88732d;background:#151309}
.square{width:23px;height:23px;flex:0 0 23px;border:2px solid #626266;border-radius:6px;margin-top:2px;color:#171309;font-weight:900;font-size:16px}
.item[aria-pressed=true] .square{background:var(--gold);border-color:var(--gold)}
.copy{gap:5px}.check-title{font-size:16px;font-weight:720;line-height:1.4;letter-spacing:-.015em}.check-desc{color:#9b9b9f;font-size:13px;line-height:1.55}
.footer{position:static;margin-top:22px;background:transparent;border:1px solid #343437;border-radius:19px;padding:23px 20px;text-align:center;box-shadow:none}
.status{font-size:21px;font-weight:850;letter-spacing:.08em}.status.ready{color:var(--green)}
.progress{font-size:12px;color:#9a9a9d;margin-top:8px;letter-spacing:.09em}
.bar{height:5px;background:#29292b;border-radius:6px;margin-top:20px}.fill{background:var(--gold)}
.log-label{text-align:left;letter-spacing:.1em}.log-note{background:var(--card);border:1px solid #343437;border-radius:12px;padding:13px}
.log-btn{border-radius:12px;min-height:46px;background:var(--gold);border-color:var(--gold)}
.log-btn.secondary{background:#17140b;border-color:#554821;color:#f2e2aa}
button.reset{border-radius:12px;padding:12px 18px}
.prompt{border:1px solid #665522;background:#17150e;border-radius:16px;padding:18px;color:#e3c65e;font-size:13px;line-height:1.65}
.actions button{border-radius:12px;min-height:43px}
.log-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;margin:11px 0}
.stat-number{color:var(--white)}.log-tools button{border-radius:11px;padding:11px 13px}
.note{color:#777;font-size:11px;margin-top:25px}
.hidden{display:none!important}
@media(max-width:370px){.tab{font-size:9px;padding:7px 2px}.tabs{gap:5px}h1{font-size:30px}}
</style></head><body><main><div class="brand">CASA BANKO</div><h1>BANKO TRADER CHECKPOINT</h1><div class="subtitle">DISCIPLINE BEFORE PROFIT</div><div class="tabs"><button class="tab active" data-tab="entry">ENTRY CHECKPOINT</button><button class="tab" data-tab="missed">MISSED A TRADE</button><button class="tab" data-tab="history">HISTORY</button><button class="tab" data-tab="stats">STATS</button></div><p class="intro" id="intro">Your strategy determines your setup. Your discipline determines whether you should execute it.</p><div id="items"></div><div id="records" class="hidden"></div><div class="footer"><div class="status" id="status">CHECKPOINT LOCKED</div><div class="progress" id="progress">0 of 9 complete</div><div class="bar"><div class="fill" id="fill"></div></div><label class="log-label" for="reflection">OPTIONAL REFLECTION</label><textarea id="reflection" class="log-note" rows="2" placeholder="What did I notice or learn?"></textarea><div class="log-actions"><button id="log-cleared" class="log-btn">📈 LOG CLEARED TO TRADE</button><button id="log-no-trade" class="log-btn secondary">❌ LOG NO-TRADE DECISION</button><button id="log-reset" class="log-btn secondary hidden">LOG MISSED-TRADE RESET</button></div><button class="reset" id="reset">RESET CHECKPOINT</button><div id="save-message" role="status" class="log-small"></div></div><div class="note">A checkpoint for discipline, not a guarantee of trading results.</div></main><script>const sets={entry:[{section:'01 / THE SETUP',title:'Review my analysis & trading plan',desc:"I've identified market direction, key levels, and what I'm expecting price to do."},{section:'01 / THE SETUP',title:'My analysis matches current structure',desc:"The current market structure supports my plan, or I've adjusted it accordingly.",review:true},{section:'01 / THE SETUP',title:'My entry confirmation is present',desc:"My strategy's required entry conditions are met. I'm not entering based on assumptions."},{section:'02 / MY MINDSET',title:"I'm not forcing a trade",desc:"I'm not trading because of boredom, FOMO, frustration, or pressure to make money."},{section:'02 / MY MINDSET',title:'I accept the outcome',desc:"I'm comfortable with a loss, a missed opportunity, or no trade at all."},{section:'02 / MY MINDSET',title:"I'm mentally ready",desc:"I'm calm, focused, and prepared to follow my plan."},{section:'03 / MY RULES',title:'My trading rules are respected',desc:'This trade follows my approved trading hours, strategy, and personal limits.'},{section:'03 / MY RULES',title:'My risk and exits are planned',desc:'I know my position size, stop-loss, target, and management plan.'},{section:'03 / MY RULES',title:"I'm ready to execute my plan",desc:'I will follow my confirmed setup and manage the trade without emotional decisions.'}],missed:[{section:'01 / RESET',title:'I accept the missed opportunity',desc:"The profit I didn't capture is not money I lost."},{section:'01 / RESET',title:'I am not trying to compensate',desc:"My next trade won't be motivated by frustration or the need to make money."},{section:'01 / RESET',title:"I've stepped away and reset",desc:'I took a five-minute break and can evaluate price calmly.'},{section:'01 / RESET',title:'Let price create another setup opportunity',desc:"Missing the first entry doesn't mean missing the entire move. I will wait for price to develop another valid setup instead of chasing."}]};let tab='entry';const checked={entry:new Set(),missed:new Set()},reviewed=new Set();const root=document.getElementById('items');function render(){root.replaceChildren();let section='';sets[tab].forEach((x,i)=>{if(x.section!==section){section=x.section;let h=document.createElement('div');h.className='section';h.textContent=section;root.append(h)}let b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-pressed',checked[tab].has(i));let sq=document.createElement('span');sq.className='square';sq.textContent=checked[tab].has(i)?'✓':'';let copy=document.createElement('span');copy.className='copy';let title=document.createElement('span');title.className='check-title';title.textContent=x.title;let desc=document.createElement('span');desc.className='check-desc';desc.textContent=x.desc;copy.append(title,desc);b.append(sq,copy);b.onclick=()=>{if(checked[tab].has(i)){checked[tab].delete(i);if(x.review)reviewed.delete(i);render();return}if(x.review&&!reviewed.has(i)){showReview(b,i);return}checked[tab].add(i);render()};root.append(b)});let n=checked[tab].size,total=sets[tab].length;document.getElementById('progress').textContent=`${n} of ${total} complete`;document.getElementById('fill').style.width=(100*n/total)+'%';let status=document.getElementById('status');status.textContent=n===total?(tab==='entry'?'GREEN LIGHT — PLAN CONFIRMED':'RESET COMPLETE'):(tab==='entry'?'CHECKPOINT LOCKED':'NO CHASING');status.classList.toggle('ready',n===total);document.getElementById('log-cleared').disabled=tab!=='entry'||n!==total;document.getElementById('log-reset').disabled=tab!=='missed'||n!==total;}function showReview(button,i){const prompt=document.createElement('div');prompt.className='prompt';prompt.textContent='Does current market structure still support your trading plan?';const actions=document.createElement('div');actions.className='actions';const yes=document.createElement('button');yes.textContent='YES';const no=document.createElement('button');no.textContent='NO';actions.append(yes,no);prompt.append(actions);button.after(prompt);button.disabled=true;yes.onclick=()=>{reviewed.add(i);checked.entry.add(i);render()};no.onclick=()=>{prompt.replaceChildren();prompt.textContent='PAUSE: Reassess higher-timeframe structure, market phase, key levels, directional bias, and whether the setup has been invalidated. Update your analysis and trading plan before continuing.';const retry=document.createElement('button');retry.className='reset';retry.textContent='REASSESS COMPLETE — CHECK AGAIN';retry.onclick=()=>render();prompt.append(document.createElement('br'),retry)}}document.querySelectorAll('.tab[data-tab="entry"],.tab[data-tab="missed"]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.getElementById('items').classList.remove('hidden');document.getElementById('records').classList.add('hidden');document.querySelector('.footer').classList.remove('hidden');document.getElementById('log-reset').classList.toggle('hidden',tab!=='missed');document.getElementById('log-cleared').classList.toggle('hidden',tab==='missed');document.getElementById('log-no-trade').classList.toggle('hidden',tab==='missed');document.getElementById('intro').textContent=tab==='entry'?'Your strategy determines your setup. Your discipline determines whether you should execute it.':'You missed the move. You do not need to pay the market with another trade.';document.getElementById('reset').textContent=tab==='entry'?'RESET CHECKPOINT':'RESET REFLECTION';render()});document.getElementById('reset').onclick=()=>{checked[tab].clear();if(tab==='entry')reviewed.clear();render()};render();
// Personal checkpoint records are local to this browser. No account or network transmission.
const STORAGE_KEY='banko_trader_checkpoint_logs_v1';
function readLogs(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function writeLogs(logs){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));return true}catch(e){alert('Could not save. Browser storage may be full or disabled.');return false}}
function makeLog(decision){const n=checked[tab].size,total=sets[tab].length;if(decision==='cleared'&&(tab!=='entry'||n!==total))return;if(decision==='reset'&&(tab!=='missed'||n!==total))return;if(decision==='no-trade'&&tab!=='entry')return;
const log={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),at:new Date().toISOString(),kind:tab,decision,answers:sets[tab].map((x,i)=>({title:x.title,checked:checked[tab].has(i)})),note:document.getElementById('reflection').value.trim().slice(0,2000)};
const logs=readLogs();logs.unshift(log);if(!writeLogs(logs))return;checked[tab].clear();if(tab==='entry')reviewed.clear();document.getElementById('reflection').value='';render();document.getElementById('save-message').textContent='Saved to this device. View it in HISTORY.'}
document.getElementById('log-cleared').onclick=()=>makeLog('cleared');
document.getElementById('log-no-trade').onclick=()=>makeLog('no-trade');
document.getElementById('log-reset').onclick=()=>makeLog('reset');
function elem(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}
function btn(label,fn){const b=elem('button','',label);b.type='button';b.onclick=fn;return b}
function decisionLabel(log){return log.decision==='cleared'?'📈 CLEARED TO TRADE':log.decision==='no-trade'?'❌ DECIDED NOT TO TRADE':'MISSED-TRADE RESET'}
function showPage(page){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));document.getElementById('items').classList.add('hidden');document.querySelector('.footer').classList.add('hidden');const panel=document.getElementById('records');panel.classList.remove('hidden');panel.replaceChildren();document.getElementById('intro').textContent=page==='history'?'Review your decisions and the conditions behind them.':'Your progress is measured by your decisions, not your profit.';
const logs=readLogs();
if(page==='history'){panel.append(elem('div','section','CHECKPOINT HISTORY'));if(!logs.length)panel.append(elem('div','empty','No checkpoints logged yet. Your saved decisions will appear here.'));
for(const log of logs){const card=elem('div','log-card');const row=elem('div','log-row');row.append(elem('span','log-meta',new Date(log.at).toLocaleString()),elem('span','log-meta',log.answers.filter(a=>a.checked).length+'/'+log.answers.length));card.append(row,elem('div','log-title',decisionLabel(log)));if(log.note)card.append(elem('div','log-small',log.note));const details=elem('details');details.append(elem('summary','','View checklist answers'));for(const a of log.answers)details.append(elem('div','log-small',(a.checked?'✓ ':'○ ')+a.title));card.append(details);const tools=elem('div','log-tools');tools.append(btn('DELETE',()=>{if(confirm('Delete this checkpoint record?')){writeLogs(readLogs().filter(x=>x.id!==log.id));showPage('history')}}));card.append(tools);panel.append(card)}
const tools=elem('div','log-tools');tools.append(btn('EXPORT BACKUP',()=>{const data=JSON.stringify({app:'BANKO TRADER CHECKPOINT',version:1,exportedAt:new Date().toISOString(),logs:readLogs()},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='banko-checkpoint-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}));tools.append(btn('DELETE ALL HISTORY',()=>{if(confirm('Permanently delete all saved checkpoint history on this device?')){writeLogs([]);showPage('history')}}));panel.append(tools)}
else{panel.append(elem('div','section','MY DISCIPLINE'));const cleared=logs.filter(x=>x.decision==='cleared').length,notrade=logs.filter(x=>x.decision==='no-trade').length,resets=logs.filter(x=>x.decision==='reset').length,entries=cleared+notrade;const stats=[['CHECKPOINTS LOGGED',logs.length],['ENTRY CLEARANCE RATE',entries?Math.round(cleared/entries*100)+'%':'—'],['NO-TRADE DECISIONS',notrade],['MISSED-TRADE RESETS',resets]];const grid=elem('div','stat-grid');for(const [name,value] of stats){const card=elem('div','log-card');card.append(elem('div','log-meta',name),elem('div','stat-number',String(value)));grid.append(card)}panel.append(grid);const misses={};for(const l of logs.filter(x=>x.kind==='entry'))for(const a of l.answers)if(!a.checked)misses[a.title]=(misses[a.title]||0)+1;const sorted=Object.entries(misses).sort((a,b)=>b[1]-a[1]);panel.append(elem('div','section','MOST FREQUENTLY UNCONFIRMED'));if(!sorted.length)panel.append(elem('div','log-small','No unchecked conditions recorded yet.'));else for(const [name,count] of sorted.slice(0,5)){const card=elem('div','log-card');card.append(elem('div','log-title',name),elem('div','log-small',count+' saved checkpoint'+(count===1?'':'s')+' not confirmed'));panel.append(card)}panel.append(elem('p','notice','Clearance rate measures the share of saved entry decisions marked cleared. It is not a profitability or overall discipline score.'))}
panel.append(elem('p','notice','Records are saved only in this browser on this device. Clearing browser data or switching devices can erase them. Export a backup regularly.'))}
for(const page of ['history','stats'])document.querySelector('.tab[data-tab="'+page+'"]').onclick=()=>showPage(page);
</script></body></html>
