<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0d0e"><title>BANKO TRADER CHECKPOINT</title><style>:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0d0e;color:#f4f3ef}main{max-width:610px;margin:auto;padding:32px 18px 120px}.brand{text-align:center;letter-spacing:4px;font-size:11px;color:#c8aa69;font-weight:800}h1{text-align:center;font-size:clamp(25px,6vw,38px);letter-spacing:-1.2px;margin:12px 0 6px}.subtitle{text-align:center;color:#929292;font-size:11px;letter-spacing:2px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:30px 0 22px}.tab{border:1px solid #363638;background:#171819;color:#a7a7a7;padding:14px 8px;border-radius:8px;font-size:11px;letter-spacing:.6px;font-weight:800;cursor:pointer}.tab.active{background:#eeeae1;color:#111;border-color:#eeeae1}.intro{color:#a6a6a6;font-size:13px;line-height:1.65;margin:0 0 23px}.section{margin:26px 0 12px;color:#c7aa71;font-size:11px;font-weight:800;letter-spacing:2px}.item{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:17px 14px;background:#161718;border:1px solid #303133;border-radius:9px;color:#f2f2f2;margin:8px 0;cursor:pointer}.item[aria-pressed=true]{border-color:#b89d68;background:#201f1a}.square{flex:0 0 22px;height:22px;border:1px solid #757575;border-radius:4px;display:grid;place-items:center;font-size:14px}.item[aria-pressed=true] .square{background:#c8aa69;color:#0c0d0e;border-color:#c8aa69}.copy{display:grid;gap:7px}.check-title{font-size:14px;font-weight:700}.check-desc{color:#a5a5a5;font-size:12px;line-height:1.55}.footer{position:sticky;bottom:12px;margin-top:26px;background:#1b1c1d;border:1px solid #3a3a3a;border-radius:12px;padding:17px;box-shadow:0 8px 40px #000b}.status{font-size:13px;font-weight:900;letter-spacing:1px}.status.ready{color:#c8aa69}.progress{font-size:12px;color:#aaa;margin-top:7px}.bar{height:5px;background:#3a3a3a;border-radius:5px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:#c8aa69;transition:width .2s}button.reset{margin-top:14px;background:transparent;color:#bfbfbf;border:1px solid #555;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:11px}.hidden{display:none}.prompt{border-left:2px solid #c8aa69;padding:12px 15px;background:#201e19;color:#e7d5b3;font-size:12px;line-height:1.5;margin:10px 0}.actions{display:flex;gap:9px;margin-top:12px}.actions button{padding:10px 18px;border:1px solid #87734e;border-radius:5px;background:#222;color:white;font-weight:700;cursor:pointer}.actions button:first-child{background:#c8aa69;color:#111}.note{font-size:11px;color:#777;text-align:center;margin-top:22px}</style></head><body><main><div class="brand">CASA BANKO</div><h1>BANKO TRADER CHECKPOINT</h1><div class="subtitle">DISCIPLINE BEFORE PROFIT</div><div class="tabs"><button class="tab active" data-tab="entry">ENTRY CHECKPOINT</button><button class="tab" data-tab="missed">MISSED A TRADE</button></div><p class="intro" id="intro">Your strategy determines your setup. Your discipline determines whether you should execute it.</p><div id="items"></div><div class="footer"><div class="status" id="status">CHECKPOINT LOCKED</div><div class="progress" id="progress">0 of 9 complete</div><div class="bar"><div class="fill" id="fill"></div></div><button class="reset" id="reset">RESET CHECKPOINT</button></div><div class="note">A checkpoint for discipline, not a guarantee of trading results.</div></main><script>const sets={entry:[{section:'01 / THE SETUP',title:'Review my analysis & trading plan',desc:"I've identified market direction, key levels, and what I'm expecting price to do."},{section:'01 / THE SETUP',title:'My analysis matches current structure',desc:"The current market structure supports my plan, or I've adjusted it accordingly.",review:true},{section:'01 / THE SETUP',title:'My entry confirmation is present',desc:"My strategy's required entry conditions are met. I'm not entering based on assumptions."},{section:'02 / MY MINDSET',title:"I'm not forcing a trade",desc:"I'm not trading because of boredom, FOMO, frustration, or pressure to make money."},{section:'02 / MY MINDSET',title:'I accept the outcome',desc:"I'm comfortable with a loss, a missed opportunity, or no trade at all."},{section:'02 / MY MINDSET',title:"I'm mentally ready",desc:"I'm calm, focused, and prepared to follow my plan."},{section:'03 / MY RULES',title:'My trading rules are respected',desc:'This trade follows my approved trading hours, strategy, and personal limits.'},{section:'03 / MY RULES',title:'My risk and exits are planned',desc:'I know my position size, stop-loss, target, and management plan.'},{section:'03 / MY RULES',title:"I'm ready to execute my plan",desc:'I will follow my confirmed setup and manage the trade without emotional decisions.'}],missed:[{section:'01 / RESET',title:'I accept the missed opportunity',desc:"The profit I didn't capture is not money I lost."},{section:'01 / RESET',title:'I am not trying to compensate',desc:"My next trade won't be motivated by frustration or the need to make money."},{section:'01 / RESET',title:"I've stepped away and reset",desc:'I took a five-minute break and can evaluate price calmly.'},{section:'01 / RESET',title:'Let price create another setup opportunity',desc:"Missing the first entry doesn't mean missing the entire move. I will wait for price to develop another valid setup instead of chasing."}]};let tab='entry';const checked={entry:new Set(),missed:new Set()},reviewed=new Set();const root=document.getElementById('items');function render(){root.replaceChildren();let section='';sets[tab].forEach((x,i)=>{if(x.section!==section){section=x.section;let h=document.createElement('div');h.className='section';h.textContent=section;root.append(h)}let b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-pressed',checked[tab].has(i));let sq=document.createElement('span');sq.className='square';sq.textContent=checked[tab].has(i)?'✓':'';let copy=document.createElement('span');copy.className='copy';let title=document.createElement('span');title.className='check-title';title.textContent=x.title;let desc=document.createElement('span');desc.className='check-desc';desc.textContent=x.desc;copy.append(title,desc);b.append(sq,copy);b.onclick=()=>{if(checked[tab].has(i)){checked[tab].delete(i);if(x.review)reviewed.delete(i);render();return}if(x.review&&!reviewed.has(i)){showReview(b,i);return}checked[tab].add(i);render()};root.append(b)});let n=checked[tab].size,total=sets[tab].length;document.getElementById('progress').textContent=`${n} of ${total} complete`;document.getElementById('fill').style.width=(100*n/total)+'%';let status=document.getElementById('status');status.textContent=n===total?(tab==='entry'?'GREEN LIGHT — PLAN CONFIRMED':'RESET COMPLETE'):(tab==='entry'?'CHECKPOINT LOCKED':'NO CHASING');status.classList.toggle('ready',n===total)}function showReview(button,i){const prompt=document.createElement('div');prompt.className='prompt';prompt.textContent='Does current market structure still support your trading plan?';const actions=document.createElement('div');actions.className='actions';const yes=document.createElement('button');yes.textContent='YES';const no=document.createElement('button');no.textContent='NO';actions.append(yes,no);prompt.append(actions);button.after(prompt);button.disabled=true;yes.onclick=()=>{reviewed.add(i);checked.entry.add(i);render()};no.onclick=()=>{prompt.replaceChildren();prompt.textContent='PAUSE: Reassess higher-timeframe structure, market phase, key levels, directional bias, and whether the setup has been invalidated. Update your analysis and trading plan before continuing.';const retry=document.createElement('button');retry.className='reset';retry.textContent='REASSESS COMPLETE — CHECK AGAIN';retry.onclick=()=>render();prompt.append(document.createElement('br'),retry)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.getElementById('intro').textContent=tab==='entry'?'Your strategy determines your setup. Your discipline determines whether you should execute it.':'You missed the move. You do not need to pay the market with another trade.';document.getElementById('reset').textContent=tab==='entry'?'RESET CHECKPOINT':'RESET REFLECTION';render()});document.getElementById('reset').onclick=()=>{checked[tab].clear();if(tab==='entry')reviewed.clear();render()};render();</script></body></html>
